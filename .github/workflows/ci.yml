name: Validate MVP
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: secondspace
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
          POSTGRES_DB: secondspace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U secondspace -d secondspace_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://secondspace:ci-only-not-a-production-secret@localhost:5432/secondspace_test
      MODEL_MODE: fixture
      DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - name: Build backend container
        run: docker build -f backend/Dockerfile -t second-space-backend:ci .
      - name: Build frontend container
        run: docker build -f frontend/Dockerfile -t second-space-frontend:ci .
