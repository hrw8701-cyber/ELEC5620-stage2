apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
  namespace: second-space
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: second-space
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: backend
          image: second-space-backend:demo
          imagePullPolicy: Never
          envFrom:
            - secretRef: {name: second-space-env}
          env:
            - name: UPLOAD_DIR
              value: /data/uploads
          ports:
            - containerPort: 8001
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          readinessProbe:
            httpGet: {path: /api/health, port: 8001}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '2', memory: 1Gi}
      volumes:
        - name: uploads
          persistentVolumeClaim: {claimName: uploads}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: second-space
spec:
  selector: {app: backend}
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: second-space
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: second-space-frontend:demo
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: {path: /, port: 80}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: '1', memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: second-space
spec:
  type: NodePort
  selector: {app: frontend}
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
